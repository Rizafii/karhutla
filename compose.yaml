services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karhutla}
      POSTGRES_USER: ${POSTGRES_USER:-karhutla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karhutla_local_demo}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./services/api
    env_file: .env
    environment:
      DATA_DIR: /data
    ports: ['127.0.0.1:8000:8000']
    volumes: ['./data:/data', './assets/videos:/videos:ro']
    depends_on:
      postgres: {condition: service_healthy}
    command: [sh, -c, 'alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 20
  vision:
    build: ./services/vision
    env_file: .env
    environment:
      API_URL: http://backend:8000
      DATA_DIR: /data
    volumes: ['./data:/data', './assets/models:/models:ro', './assets/videos:/videos:ro']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'from pathlib import Path; import time; p=Path("/data/worker-heartbeat"); assert p.exists() and time.time()-p.stat().st_mtime<30']
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/events}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
